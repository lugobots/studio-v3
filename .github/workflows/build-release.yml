# Build and (when secrets are present) sign Studio artifacts.
# Uploads workflow artifacts only — does not create a GitHub Release.
# On version tags (v*), also builds and publishes lugobots/studio-v3-api to Docker Hub
# with the same tag string as GitHub (and :latest).
name: Build release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (empty = current ref)
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pack: pack:win
          - os: macos-latest
            pack: pack:mac
          - os: ubuntu-latest
            pack: pack:linux
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Note signing secret availability
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ -n "${CSC_LINK:-}" || -n "${WIN_CSC_LINK:-}" || -n "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "At least one signing secret is configured for this environment."
          else
            echo "No signing secrets configured; this run produces unsigned dry-run artifacts."
          fi

      - name: Pack Electron app
        shell: bash
        env:
          # Empty CSC_LINK breaks electron-builder ("not a file"); only export when set.
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          SECRET_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          SECRET_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          SECRET_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SECRET_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -n "${SECRET_CSC_LINK:-}" ]]; then
            export CSC_LINK="$SECRET_CSC_LINK"
            export CSC_KEY_PASSWORD="${SECRET_CSC_KEY_PASSWORD:-}"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [[ -n "${SECRET_WIN_CSC_LINK:-}" ]]; then
            export WIN_CSC_LINK="$SECRET_WIN_CSC_LINK"
            export WIN_CSC_KEY_PASSWORD="${SECRET_WIN_CSC_KEY_PASSWORD:-}"
          fi
          if [[ -n "${SECRET_APPLE_API_KEY:-}" ]]; then
            export APPLE_API_KEY="$SECRET_APPLE_API_KEY"
            export APPLE_API_KEY_ID="${SECRET_APPLE_API_KEY_ID:-}"
            export APPLE_API_ISSUER="${SECRET_APPLE_API_ISSUER:-}"
          fi
          npm run ${{ matrix.pack }}

      - name: Detached GPG signature (Linux)
        if: runner.os == 'Linux'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "GPG_PRIVATE_KEY not set; skipping detached signatures (unsigned dry run)."
            exit 0
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          shopt -s nullglob
          for f in dist/Lugo-Studio-Linux-*.AppImage; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "$f"
          done

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(Lugo-Studio-*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Lugo-Studio-* artifacts in dist/" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "${files[@]}" > SHA256SUMS
          else
            python - <<'PY'
          import hashlib, glob, pathlib
          lines = []
          for path in sorted(glob.glob("Lugo-Studio-*")):
              digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              lines.append(f"{digest}  {path}")
          pathlib.Path("SHA256SUMS").write_text("\n".join(lines) + "\n")
          PY
          fi
          cat SHA256SUMS

      - name: Attest build provenance
        # Private free plans cannot persist attestations; keep checksums as the dry-run integrity signal.
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/Lugo-Studio-*

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-${{ matrix.os }}
          path: |
            dist/Lugo-Studio-*
            dist/SHA256SUMS
            dist/*.AppImage.asc
          if-no-files-found: error
          retention-days: 14

  # Publish the Studio API image whenever a GitHub version tag is built.
  # Tag and VERSION build-arg are the GitHub tag string (e.g. v0.2.0), not a stripped semver.
  publish-api-image:
    name: Publish Studio API image
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.ref != '' && startsWith(inputs.ref, 'v'))
    runs-on: ubuntu-latest
    environment: build
    steps:
      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.ref }}" ]]; then
            TAG="${{ inputs.ref }}"
            TAG="${TAG#refs/tags/}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Image publish requires a GitHub version tag starting with v; got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing lugobots/studio-v3-api:$TAG (and :latest)"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Studio API image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            lugobots/studio-v3-api:${{ steps.tag.outputs.tag }}
            lugobots/studio-v3-api:latest
